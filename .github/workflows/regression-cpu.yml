name: Regression tests (CPU)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Job 1: Compilation
  build:
    runs-on: [self-hosted, kharma]
    steps:
      - uses: actions/checkout@v4
      - name: Run compilation
        run: bash -i ./make.sh clean
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: kharma.host

  # Job 2: Test Matrix
  test:
    needs: build
    runs-on: [self-hosted, kharma]
    strategy:
      matrix:
        # add back 'resize' when new solvers work
        test_name:
        - all_pars
        - anisotropic_conduction
        - bondi
        - bondi_viscous
        - bz_monopole
        - conducting_atmosphere
        - emhdmodes
        - emhdshock
        - hubble_flow
        - mhdmodes
        - mhdmodes_smr
        - noh
        - regrid
        - reinit
        - restart
        - tilt_init
        - torus_sanity
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      - name: install pyharm
        run: pip install git+https://github.com/c-prather/pyharm@dev
      - name: Run ${{ matrix.test_name }}
        working-directory: tests/${{ matrix.test_name }}
        run: bash -i ./run.sh
