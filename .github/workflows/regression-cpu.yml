name: Regression tests (CPU)

# Generated with assistance from generative AI
# This is KHARMA's CPU regression workflow. The same jobs run for its
# own PRs/pushes and when Parthenon calls them as downstream integration tests.
on:
  push:
    branches: [stable, dev]
  pull_request:
    branches: [stable, dev]
  workflow_dispatch:
  workflow_call:
    inputs:
      kharma_ref:
        description: 'KHARMA revision (e.g. dev)'
        type: string
        required: false
        default: ''
      parthenon_ref:
        description: 'Optional Parthenon override (e.g. refs/pull/123/merge)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: kharma-cpu-ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPROC: 4
  MPI_NUM_PROCS: 4
  OMP_NUM_THREADS: 1
  HOST_ARCH: "HSW"
  MPI_EXTRA_ARGS: "--oversubscribe"

jobs:
  # Job 1: Compilation
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.kharma_ref || github.ref }}
          submodules: false
          persist-credentials: false
      - name: Most submodules
        # Check out all submodules except eigen, which is hosted on gitlab which rate-limits;
        # we don't need it anyway
        env:
          PARTHENON_REF: ${{ inputs.parthenon_ref }}
        run: |
          git submodule update --init --recursive -f external/{Catch2,kokkos-kernels,singularity-opac,singularity-eos}
          if [ -z "$PARTHENON_REF" ]; then
            git submodule update --init --recursive -f external/parthenon
          fi
      - name: Checkout candidate Parthenon
        if: ${{ inputs.parthenon_ref != '' }}
        uses: actions/checkout@v7
        with:
          repository: parthenon-hpc-lab/parthenon
          ref: ${{ inputs.parthenon_ref }}
          path: external/parthenon
          submodules: recursive
          persist-credentials: false
      - name: Show exact revisions
        run: |
          echo "KHARMA: $(git rev-parse HEAD)"
          echo "Parthenon: $(git -C external/parthenon rev-parse HEAD)"
      - name: Install prereqs
        run: |
          sudo apt-get update
          sudo apt-get install build-essential
          sudo apt-get install libopenmpi-dev libhdf5-openmpi-dev libfftw3-dev
          sudo apt-get install hdf5-tools cmake
      - name: Run compilation
        run: bash -i ./make.sh clean noopenmp
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            kharma.host
            make_args
          if-no-files-found: 'error'

  # Job 2: Test Matrix
  test:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      # add conducting_atmosphere? Long, currently GPU-only
      matrix:
        test_name:
        - all_pars
        - anisotropic_conduction
        - bondi
        - bondi_rad
        - bondi_viscous
        - bz_monopole
        - emhdmodes
        - emhdshock
        - entropy_wave
        - hubble_flow
        - mhdmodes
        - mhdmodes_smr
        - noh
        - rad_linear_waves
        - radshock
        - regrid
        - reinit
        - resize
        - restart
        - tilt_init
        - torus_sanity
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.kharma_ref || github.ref }}
          submodules: false
          persist-credentials: false
      - name: Install prereqs
        run: |
          sudo apt-get update
          sudo apt-get install libopenmpi libhdf5-openmpi libfftw3 hdf5-tools
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
      - name: Install pyharm
        run: pip install git+https://github.com/c-prather/pyharm@dev
      - name: Run ${{ matrix.test_name }}
        working-directory: tests/${{ matrix.test_name }}
        run: bash -i ./run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.test_name }}-artifacts
          path: |
            tests/${{ matrix.test_name }}
            !*.phdf
            !*.rhdf
            !*.xdmf
            !*.h5

  # Require all tests in a single status check we can mark req'd for merge
  tests-pass:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - run: exit 0
