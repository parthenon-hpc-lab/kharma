name: Regression tests (Nvidia)

on:
  # when triggered manually
  workflow_dispatch:
  # when auto merge is enabled (hack to make sure it's run before merging)
  pull_request:
    types: [auto_merge_enabled]

env:
  NPROC: 4
  MPI_NUM_PROCS: 1
  OMP_NUM_THREADS: 1
  HOST_ARCH: "HSW"
  DEVICE_ARCH: "TURING75"
  MODULEPATH: '/opt/nvidia/hpc_sdk/modulefiles:/usr/share/modulefiles'

jobs:
  # Job 1: Compilation
  build-nvidia:
    concurrency:
      group: nvidia-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - name: Install prereqs
        run: |
          sudo apt-get update
          sudo apt-get install build-essential
          sudo apt-get install libopenmpi-dev libhdf5-openmpi-dev libfftw3-dev
          sudo apt-get install hdf5-tools cmake
      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
      - name: Run compilation
        run: bash -ic './make.sh clean cuda'
      - uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            kharma.cuda
            make_args
          if-no-files-found: 'error'

  # Job 2: Test Matrix
  test-nvidia:
    needs: build-nvidia
    runs-on: [self-hosted, kharma-gpu-nv]
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 'resize' should work but too big for the test GPU
        test_name:
        - all_pars
        - anisotropic_conduction
        - bondi
        - bondi_rad
        - bondi_viscous
        - bz_monopole
        - conducting_atmosphere
        - emhdmodes
        - hubble_flow
        - mhdmodes
        - mhdmodes_smr
        - noh
        - rad_linear_waves
        - radshock
        - regrid
        - reinit
        - restart
        - tilt_init
        - torus_sanity
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
      - uses: actions/download-artifact@v8
        with:
          name: build-artifacts
      - name: install pyharm
        run: pip install git+https://github.com/c-prather/pyharm@dev
      - name: Run ${{ matrix.test_name }}
        working-directory: tests/${{ matrix.test_name }}
        run: bash -i ./run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.test_name }}-artifacts
          path: |
            tests/${{ matrix.test_name }}
            !*.phdf
            !*.rhdf
            !*.xdmf
            !*.h5

  # Require all tests in a single status check we can mark req'd for merge
  tests-pass-nvidia:
    runs-on: ubuntu-latest
    needs: test-nvidia
    steps:
      - run: exit 0
